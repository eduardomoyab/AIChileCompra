# ============================================
# Configuración para Catalogación de Computadores
# ============================================
#
# NOTA: Las configuraciones de LLM, temperaturas, y retrieval
# ahora están en el archivo .env
# Este archivo solo contiene configuraciones específicas del workflow
#

# Paths (relativos desde el directorio raíz del proyecto)
path_diccionario_procesador: diccionarios/Computadores/diccionario_procesador.xlsx

# Campos del payload de entrada (para validación)
payload_fields:
  - ROWNUM
  - DescripcionProductoComprador
  - DescripcionProductoProveedor
  - productoname

# Campos de salida esperados (para validación y documentación)
output_fields:
  - ROWNUM
  - Modalidad
  - Tipo Producto
  - Marca
  - Procesador
  - Núcleos
  - Hilos Procesador
  - RAM (GB)
  - Tipo RAM
  - Sistema Operativo
  - Tipo Almacenamiento
  - Almacenamiento (GB)
  - Pantalla (Pulgadas)

